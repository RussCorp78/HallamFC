<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Poll briefly until the FWP widget finishes building its table
    const checkWidget = setInterval(() => {
      const widgetContainer = document.querySelector('.fwp-embed');
      const table = widgetContainer ? widgetContainer.querySelector('table') : null;

      if (table) {
        clearInterval(checkWidget); // Widget found! Stop polling.

        // 1. Define our 8-day date window (Today + next 7 days)
        const startWindow = new Date();
        startWindow.setHours(0, 0, 0, 0);

        const endWindow = new Date(startWindow);
        endWindow.setDate(startWindow.getDate() + 7);
        endWindow.setHours(23, 59, 59, 999);

        let isCurrentDateInWindow = false;

        // 2. Loop through every table row in order
        table.querySelectorAll('tr').forEach(row => {
          const rowText = row.textContent.trim();

          // Check if this row is a Date Header (e.g., "Saturday 3rd October" or "Tuesday 6th October")
          // We look for month names or ordinal suffixes (1st, 2nd, 3rd, 4th)
          const cleanText = rowText.replace(/(\d+)(st|nd|rd|th)/i, '$1');
          const parsedDate = Date.parse(cleanText);

          // If the row contains a valid date string, update our state
          if (!isNaN(parsedDate) && (rowText.includes('2026') || rowText.match(/January|February|March|April|May|June|July|August|September|October|November|December/i))) {
            const rowDate = new Date(parsedDate);
            
            // Check if this date falls between today and 7 days from now
            isCurrentDateInWindow = (rowDate >= startWindow && rowDate <= endWindow);
          }

          // 3. Hide or show the row depending on the active date section
          if (!isCurrentDateInWindow) {
            row.style.display = 'none';
          } else {
            row.style.display = ''; // Restore default row visibility
          }
        });
      }
    }, 200); // Check every 200ms
  });
</script>
