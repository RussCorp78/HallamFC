<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>All Fixtures</title>

  </style>

  <body>

  <!-- Container element for Football Web Pages widget -->
<div id="fwp-container" 
     class="fwp-embed" 
     data-font-family="Open Sans" 
     data-border-color="#316395" 
     data-heading-color="#030303" 
     data-hover-background-color="#57bbec"></div>

<script>
  (function() {
    // 1. Get today's date parts
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
    const day = String(today.getDate()).padStart(2, '0');

    // 2. Build the YYYYMMDD date string (e.g. "20261003")
    const dateStr = `${year}${month}${day}`;

    // 3. Set the target URL dynamically on the container element
    const container = document.getElementById('fwp-container');
    container.setAttribute(
      'data-url', 
      `northern-premier-league-east-division/${dateStr}`
    );

    // 4. Inject the embed script AFTER setting the attribute
    const fwpScript = document.createElement('script');
    fwpScript.src = "https://www.footballwebpages.co.uk/embed.js";
    fwpScript.defer = true;
    document.body.appendChild(fwpScript);
  })();
</script>
    
  Hallam Fixtures
  
  <div class="fwp-embed" data-font-family="Open Sans" data-border-color="#316395" data-heading-color="#030303" data-hover-background-color="#57bbec" data-url="hallam/fixtures-results"></div>
  
  <br>
  <hr>
  <br>
  
  All Fixtures
  
  <div class="fwp-embed" data-font-family="Open Sans" data-border-color="#316395" data-heading-color="#030303" data-hover-background-color="#57bbec" data-url="northern-premier-league-east-division/fixtures-results/this-week"></div>

<script src="https://www.footballwebpages.co.uk/embed.js" defer>

/* Can also use the following attributes at the end 

/this-week — Matches scheduled for the current week.

/next-week — Upcoming fixtures for the following week.

/latest — The most recent set of completed results.

/upcoming — The next set of upcoming scheduled matches.

/today - For games happening today

/matches — Shows live scores

/YYYY-MM-DD" — Games for a specific date (e.g., 2026-10-03)

*/


</script>

  </body>

  </html>
